[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pywizard"
version = "1.4.3"
description = "Convert WAV files to LPC byte streams for TMS52xx speech chips"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Peter Turczak and contributors"},
]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14.1",
  "jieba>=0.42.1",
  "pypinyin>=0.55",
]

[project.urls]
Homepage = "https://github.com/ptwz/python_wizard"

[tool.setuptools]
packages = ["pywizard", "lpcplayer"]
script-files = ["python_wizard", "python_wizard_gui"]

[tool.setuptools.package-data]
pywizard = ["flite_voices.json", "native/*.c", "native/CMakeLists.txt", "bin/*"]
